name: CI

on:
  push:
    branches: [ main, zmosh-main ]
  pull_request:
    branches: [ main, zmosh-main ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Zig
        run: |
          curl -sSL https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz | tar -xJ -C /tmp
          echo "/tmp/zig-x86_64-linux-0.17.1" >> $GITHUB_PATH

      - name: Run tests
        run: zig build test
